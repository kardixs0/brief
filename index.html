<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAISON NOUR — Dossier</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",sans-serif;background:#f6f4f0;color:#1c1a17;min-height:100vh;display:grid;place-items:center;padding:24px}
.c{max-width:400px;text-align:center;background:#fff;border:1px solid #e6e1d8;border-radius:14px;padding:34px 28px}
.m{width:38px;height:38px;border-radius:9px;background:#1c1a17;color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 18px}
h1{font-size:19px;margin-bottom:8px}
p{font-size:13.5px;color:#6d675e;line-height:1.65;margin-bottom:18px}
a{display:block;padding:13px;background:#1c1a17;color:#fff;border-radius:8px;text-decoration:none;font-weight:600;font-size:13.5px}
.b{height:4px;background:#eee7dc;border-radius:3px;overflow:hidden;margin-bottom:18px;display:none}
.b i{display:block;height:100%;width:0;background:#1c1a17;transition:width .25s}
.s{font-size:11.5px;color:#8b857b;margin-top:16px;line-height:1.7}
</style></head><body><div class="c">
<div class="m">MN</div>
<h1>Votre dossier est prêt</h1>
<p id="t">Préparation du fichier…</p>
<div class="b" id="bar"><i id="fill"></i></div>
<a id="d" href="Brief.zip" download="Brief.zip">Télécharger le dossier</a>
<p class="s">Le téléchargement démarre automatiquement.<br>Ouvrez ensuite le fichier, puis le document qu'il contient.</p>
</div>
<script>window.addEventListener("load",()=>setTimeout(()=>document.getElementById("d").click(),400));</script>
</body></html>
